# Infra locale : docker compose up -d   (Postgres, Redis, Mailpit)
# Stack complète : docker compose --profile app up --build
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-baskets}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD dans .env}
      POSTGRES_DB: ${POSTGRES_DB:-baskets}
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-baskets}"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  mailpit:
    image: axllent/mailpit:latest
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
  backend-server:
    profiles: [app]
    build: { context: ./apps/backend }
    env_file: ./apps/backend/.env
    environment:
      MEDUSA_WORKER_MODE: server
      DATABASE_URL: postgres://${POSTGRES_USER:-baskets}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-baskets}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports: ["9000:9000"]
  backend-worker:
    profiles: [app]
    build: { context: ./apps/backend }
    env_file: ./apps/backend/.env
    environment:
      MEDUSA_WORKER_MODE: worker
      DISABLE_MEDUSA_ADMIN: "true"
      DATABASE_URL: postgres://${POSTGRES_USER:-baskets}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-baskets}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
  storefront:
    profiles: [app]
    build: { context: ./apps/storefront }
    env_file: ./apps/storefront/.env
    ports: ["8000:3000"]
    depends_on: [backend-server]
volumes:
  postgres-data:
