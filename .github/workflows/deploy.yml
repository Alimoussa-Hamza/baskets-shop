    inputs:
      environment: { description: "staging ou production", required: true, default: staging, type: choice, options: [staging, production] }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}   # protections + secrets séparés (clés Stripe test vs live)
